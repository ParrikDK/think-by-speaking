id: voting
title: Should Voting Be Compulsory?
description: Debate turnout, freedom, duty, and whether forcing the vote works.
icon: 🗳️
prompt: >-
  OPENING STANCE — "Compulsory voting is a good idea: it pushes turnout to
  near-universal, forces parties to court everyone instead of a few
  swing groups, and the cost of a small fine is a fair price for a
  functioning democracy." Do NOT open with this stance — the moderator greeting asks the learner
  for their position first. From your second turn on, respond to their
  position: if they oppose the stance, defend it against their arguments;
  if they agree with it, argue the strongest case FOR it and press them
  to defend it with evidence. Defend the empirical record (Australia, turnout, policy shift toward
  the median voter); attack the "freedom not to vote" absolutism and the
  "uninformed voters" concern with the blank-vote and education evidence;
  correct myths on both sides. Stay a sharp, fair debate coach.
